substitutions:
  device_name: esp32-p4-kit
  friendly_name: ESP32-P4 All-in-One

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    board: esp32-p4-function-ev-board
    build_flags:
      - "-DBOARD_HAS_PSRAM"
      - "-mfix-esp32-psram-cache-issue"

esp32:
  board: esp32-p4-function-ev-board
  variant: esp32p4
  framework:
    type: esp-idf
    version: 5.4.2
    sdkconfig_options:
      CONFIG_ESP32P4_REV_MIN_0: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

logger:
  level: INFO

api:
  encryption:
    key: REPLACE_ME
  reboot_timeout: 0s

ota:
  - platform: esphome
    # SECURITY: credential omitted from documentation example

# This minimal example uses Ethernet. The ESP32-P4 has no built-in Wi-Fi.
# For Wi-Fi, configure the ESP32-C6 expansion module with the one-wire,
# full-duplex ESP-Hosted SPI transport shown in the ESP32-C6 section above;
# do not add a standalone wifi: block without that transport configuration.

# Web server for diagnostics
web_server:
  port: 80
  auth:
    username: REPLACE_ME
    # SECURITY: credential omitted from documentation example

# Shared I2C1 bus for sensors, headers, and GT911 touch
# Camera control uses the separate I2C2 bus on GPIO45/GPIO46.
i2c:
  - id: bus_a
    sda: GPIO18
    scl: GPIO19
    scan: true
    frequency: 100kHz

# GPIO2 is reserved for the ESP32-C6 enable/reset signal when the Wi-Fi
# module is installed, so do not use it as a status LED in this configuration.
# Add status_led only after verifying a separate, unused LED GPIO.

# Main sensors and controls
sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
# Ethernet Configuration (RMII definition)
ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1

  # Add your integrated sensors here
  # following the patterns shown above

binary_sensor:
  - platform: status
    name: "Status"

switch:
  - platform: restart
    name: "Restart"
